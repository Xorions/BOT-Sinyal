name: Crypto Daily Briefing

# 00:00 UTC = 07:00 WIB (satu kali sehari)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Butuh akses tulis untuk meng-commit data/history.json (history sinyal)
# supaya bisa dievaluasi pada eksekusi berikutnya.
permissions:
  contents: write

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan Daily Briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit & push history sinyal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan history."
          else
            git commit -m "Update history sinyal harian [skip ci]"
            git push
          fi
