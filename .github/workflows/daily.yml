name: Crypto Day Trading Signals

# 2x sehari: 00:00 UTC = 07:00 WIB (Sesi Pagi) & 12:00 UTC = 19:00 WIB (Sesi Malam)
on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

# Butuh akses tulis untuk meng-commit data/history.json (history sinyal)
# supaya bisa dievaluasi pada eksekusi berikutnya.
permissions:
  contents: write

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan Day Trading Signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MTF_SCAN_LIMIT: ${{ vars.MTF_SCAN_LIMIT }}
          CONFLUENCE_MIN: ${{ vars.CONFLUENCE_MIN }}
        run: python bot.py

      - name: Commit & push history sinyal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan history."
          else
            git commit -m "Update history sinyal harian [skip ci]"
            git push
          fi
